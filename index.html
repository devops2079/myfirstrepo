<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My First Web Page</h1>

    <!-- Paragraph with inline formatting -->
    <p>This is a standard paragraph. You can easily make text <strong>bold</strong> or <em>italicized</em> to emphasize key points.</p>

    <!-- Subheading -->
    <h2>Useful Elements</h2>

    <!-- Unordered List -->
    <ul>
        <li>First item in a bulleted list</li>
        <li>Second item in a bulleted list</li>
    </ul>

    <!-- External Link -->
    <p>Visit the official <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a> for extensive documentation.</p>

    <!-- Image Example -->
    <!-- Replace "placeholder.jpg" with your actual image path -->
    <img src="placeholder.jpg" alt="A descriptive placeholder image" width="300" height="200">

</body>
</html>
